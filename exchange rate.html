<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange Rate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            width: 50%;
            margin: auto;
        }
        input, select, button {
            margin: 10px 0;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Currency Exchange Rate</h2>
        <form id="exchangeRateForm">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" placeholder="Enter amount" required>

            <label for="fromCurrency">From Currency:</label>
            <select id="fromCurrency" required>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <!-- Add more currencies as needed -->
            </select>

            <label for="toCurrency">To Currency:</label>
            <select id="toCurrency" required>
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="GBP">GBP</option>
                <!-- Add more currencies as needed -->
            </select>

            <button type="submit">Convert</button>
        </form>

        <div id="result">
            <p><strong>Converted Amount:</strong> <span id="convertedAmount"></span></p>
            <p><strong>Exchange Rate:</strong> <span id="exchangeRateValue"></span></p>
            <p><strong>Rate Date:</strong> <span id="rateDate"></span></p>
        </div>
    </div>

    <script>
        document.getElementById('exchangeRateForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Get values from the form
            const amount = document.getElementById('amount').value;
            const fromCurrency = document.getElementById('fromCurrency').value;
            const toCurrency = document.getElementById('toCurrency').value;

            // Ensure the amount is valid
            if (amount <= 0) {
                alert("Please enter a valid amount.");
                return;
            }

            // Replace with your actual API endpoint
            const apiURL = `https://api.exchangerate-api.com/v4/latest/${fromCurrency}`;

            // Fetch the exchange rate data
            fetch(apiURL)
                .then(response => response.json())
                .then(data => {
                    if (data.rates && data.rates[toCurrency]) {
                        const rate = data.rates[toCurrency];
                        const convertedAmount = (amount * rate).toFixed(2); // Convert and round to 2 decimal places
                        const date = data.date;

                        // Display the exchange rate, date, and converted amount
                        document.getElementById('convertedAmount').textContent = `${convertedAmount} ${toCurrency}`;
                        document.getElementById('exchangeRateValue').textContent = rate;
                        document.getElementById('rateDate').textContent = date;
                        document.getElementById('result').style.display = 'block';
                    } else {
                        alert("Unable to get exchange rate for the selected currencies.");
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    alert("An error occurred while fetching the exchange rate.");
                });
        });
    </script>
</body>
</html>
